; PHP-FPM pool (overrides the image default of pm.max_children=5).
; Sized for a ~2 GB instance: 16 workers * ~80 MB worst case ~= 1.3 GB.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8

; Recycle workers now and then to keep memory in check.
pm.max_requests = 500

; Log slow requests.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

catch_workers_output = yes
decorate_workers_output = no

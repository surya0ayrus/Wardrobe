; All processes of the app container. Logs go to the container output.
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 9000 --workers 2 --proxy-headers --forwarded-allow-ips=*
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=5

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=5

; Background jobs / scheduler: none yet. When you need them, add a program here
; (e.g. `arq` or `celery worker`, or a small loop for scheduled tasks).
